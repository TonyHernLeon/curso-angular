<h1>{{ name }}</h1>

<dl>
  <td>Nombre: </td>
  <dd>{{ name }}</dd>

  <td>Edad: </td>
  <dd>{{ edad }}</dd>

  <td>Método: </td>
  <dd>{{ getHeroDescription() }}</dd>

  <td>Capitalizado: </td>
  <dd>{{ capitalazedName }}</dd>
</dl>

<button *ngIf="name !== 'Superman'" class="btn btn-primary mx-2" (click)="changeHero()">
  Cambiar nombre
</button>


<button *ngIf="edad !== 33" class="btn btn-primary mx-2" (click)="changeEdad()">
  Cambiar edad
</button>

<button class="btn btn-primary" (click)="resetForm()">
  Reset Formulario
</button>
